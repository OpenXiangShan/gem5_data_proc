domain: topdown

defaults:
  gem5_cpu_prefix: system.cpu

groups:
  topdown_intel:
    base_gem5: "{gem5_cpu_prefix}"
    gem5:
      inst_spec: "iew.dispatchedInsts"
      fetch_bubble: "fetch.fetchBubbles"
      fetch_bubble_eq_max: "fetch.fetchBubbles_max"
      br_mis_pred: "iew.branchMispredicts"
      total_squash: "commit.totalSquash"
      recovery_bubble: "commit.recovery_bubble"
      exec_stall_cycle: "scheduler.exec_stall_cycle"
      mem_stall_any_load: "scheduler.memstall_any_load"
      mem_stall_store: "scheduler.memstall_any_store"
      mem_stall_l1_miss: "scheduler.memstall_l1miss"
      mem_stall_l2_miss: "scheduler.memstall_l2miss"
      mem_stall_l3_miss: "scheduler.memstall_l3miss"
    xs:
      inst_spec: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.decode\\.DecodeStage\\@\\w+: inst_spec,\\s+(\\d+)"
      fetch_bubble: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.frontend\\.ibuffer\\.IBuffer\\@\\w+: if_fetch_bubble,\\s+(\\d+)"
      fetch_bubble_eq_max: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.frontend\\.ibuffer\\.IBuffer\\@\\w+: if_fetch_bubble_eq_max,\\s+(\\d+)"
      br_mis_pred: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.frontend\\.FrontendInlinedImp\\@\\w+: squashCycles_bpWrong_redirect,\\s+(\\d+)"
      recovery_bubble: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.decode\\.DecodeStage\\@\\w+: recovery_bubble,\\s+(\\d+)"
      exec_stall_cycle: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.TopDownGen\\@\\w+: exec_stall_cycle,\\s+(\\d+)"
      mem_stall_any_load: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.mem\\.VirtualLoadQueue\\@\\w+: mem_stall_anyload,\\s+(\\d+)"
      mem_stall_store: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.TopDownGen\\@\\w+: mem_stall_store,\\s+(\\d+)"
      mem_stall_l1_miss: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.TopDownGen\\@\\w+: mem_stall_l1miss,\\s+(\\d+)"
      mem_stall_l2_miss: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.TopDownGen\\@\\w+: mem_stall_l2miss,\\s+(\\d+)"
      mem_stall_l3_miss: "\\[PERF \\]\\[time=\\s+\\d+\\] xiangshan\\.backend\\.TopDownGen\\@\\w+: mem_stall_l3miss,\\s+(\\d+)"

